<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo-registry-widget playground</title>
    <link rel="stylesheet" href="../dist/default-styles.css" />
    <style>
      :root {
        --pg-font: "Sora", "Avenir Next", "Segoe UI", sans-serif;
        --pg-bg: #f3f5f8;
        --pg-card: #ffffff;
        --pg-border: #e2e8f0;
        --pg-text: #0f172a;
        --pg-muted: #64748b;
        --pg-accent: #0f766e;
        --pg-accent-soft: rgba(15, 118, 110, 0.12);
        --pg-radius-lg: 16px;
        --pg-radius-md: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--pg-font);
        color: var(--pg-text);
        background:
          radial-gradient(circle at 90% -10%, rgba(15, 118, 110, 0.16), transparent 35%),
          radial-gradient(circle at -10% 0%, rgba(2, 132, 199, 0.14), transparent 28%),
          var(--pg-bg);
      }

      header {
        border-bottom: 1px solid var(--pg-border);
        background: color-mix(in srgb, #fff 92%, transparent);
        backdrop-filter: blur(6px);
      }

      nav {
        max-width: 1060px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-title {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      nav a {
        color: var(--pg-accent);
        text-decoration: none;
        font-weight: 600;
      }

      main {
        max-width: 1060px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.7rem, 2vw, 2.2rem);
      }

      .lead {
        margin: 0 0 18px;
        color: var(--pg-muted);
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--pg-card);
        border: 1px solid var(--pg-border);
        border-radius: var(--pg-radius-lg);
        box-shadow: 0 16px 38px rgba(15, 23, 42, 0.06);
      }

      .control {
        padding: 12px;
        border-radius: var(--pg-radius-md);
        border: 1px solid var(--pg-border);
        background: #fff;
      }

      .control label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--pg-muted);
        font-weight: 600;
      }

      .control input,
      .control select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 9px 10px;
        font: inherit;
        color: var(--pg-text);
        background: #fff;
      }

      .control input:focus,
      .control select:focus {
        outline: none;
        border-color: var(--pg-accent);
        box-shadow: 0 0 0 3px var(--pg-accent-soft);
      }

      #customBaseUrl {
        margin-top: 10px;
        display: none;
      }

      .panel {
        padding: 18px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .toolbar button {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        cursor: pointer;
      }

      #reinitBtn {
        background: var(--pg-accent);
        color: #fff;
      }

      #toggleOpenBtn {
        background: #eef2f7;
        color: #334155;
        border-color: #d5dde8;
      }

      .meta {
        margin-top: 14px;
        color: var(--pg-muted);
        font-size: 13px;
        word-break: break-word;
      }

      #demosBtn {
        --drw-accent: var(--pg-accent);
      }

      @media (max-width: 700px) {
        main {
          padding-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-title">demo-registry-widget</div>
        <a href="/" title="Documentation">Documentation</a>
      </nav>
    </header>

    <main>
      <h1>Playground</h1>
      <p class="lead">Manual verification for full/micro mode, sorting, limits, and load failures.</p>

      <div class="grid">
        <section class="controls card">
          <div class="control">
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="full">full</option>
              <option value="micro">micro</option>
            </select>
          </div>

          <div class="control">
            <label for="limit">Limit</label>
            <input id="limit" type="number" min="0" value="8" />
          </div>

          <div class="control">
            <label for="sort">Sort (full only)</label>
            <select id="sort">
              <option value="none">none</option>
              <option value="title">title</option>
              <option value="slug">slug</option>
            </select>
          </div>

          <div class="control">
            <label for="scenario">Load Scenario</label>
            <select id="scenario">
              <option value="ok">ok</option>
              <option value="missing">missing file</option>
              <option value="invalid">invalid base URL</option>
              <option value="offline">offline-like path</option>
              <option value="no-base">no baseUrl</option>
              <option value="custom">custom base URL</option>
            </select>
            <input type="text" id="customBaseUrl" name="customBaseUrl" placeholder="https://example.com" />
          </div>
        </section>

        <section class="panel card">
          <div class="toolbar">
            <button id="reinitBtn" type="button">Re-init widget</button>
            <button id="toggleOpenBtn" type="button">Toggle popover</button>
          </div>

          <button id="demosBtn" aria-expanded="false" type="button">Demos</button>
          <div id="demosPopover">
            <div id="demosContent"></div>
          </div>

          <div class="meta" id="meta"></div>
        </section>
      </div>
    </main>

    <script type="module">
      import initFull from "../dist/full.min.js";
      import initMicro from "../dist/micro.min.js";

      const modeEl = document.getElementById("mode");
      const limitEl = document.getElementById("limit");
      const sortEl = document.getElementById("sort");
      const scenarioEl = document.getElementById("scenario");
      const reinitBtn = document.getElementById("reinitBtn");
      const toggleOpenBtn = document.getElementById("toggleOpenBtn");
      const demosBtn = document.getElementById("demosBtn");
      const demosPopover = document.getElementById("demosPopover");
      const demosContent = document.getElementById("demosContent");
      const meta = document.getElementById("meta");
      const customBaseUrlEl = document.getElementById("customBaseUrl");

      function toggleCustomInput() {
        customBaseUrlEl.style.display = scenarioEl.value === "custom" ? "block" : "none";
      }

      function readScenarioBase() {
        const scenario = scenarioEl.value;
        if (scenario === "ok") return window.location.origin + "/playground";
        if (scenario === "missing") return window.location.origin + "/playground-missing";
        if (scenario === "offline") return window.location.origin + "/offline-like";
        if (scenario === "invalid") return "http://127.0.0.1:1";
        if (scenario === "custom") return customBaseUrlEl.value.trim();
        return "";
      }

      function resetView() {
        demosContent.textContent = "";
        demosPopover.removeAttribute("data-open");
        demosBtn.setAttribute("aria-expanded", "false");
      }

      function init() {
        resetView();
        toggleCustomInput();

        const mode = modeEl.value;
        const limit = Number(limitEl.value);
        const sort = sortEl.value;
        const scenario = scenarioEl.value;
        const baseUrl = readScenarioBase();

        const opts = {
          limit,
          sort,
          registryPath: "/registry.tsv",
          maxAgeMs: 0,
          cacheKeyPrefix: `demo-registry-play-${mode}-${scenario}`,
        };

        meta.textContent = `mode=${mode}, limit=${limit}, sort=${sort}, scenario=${scenario}, baseUrl=${baseUrl || "<empty>"}`;

        if (mode === "full") {
          const fullOpts = scenario === "no-base" ? opts : { ...opts, baseUrl };
          initFull(fullOpts);
          return;
        }

        const microOpts = scenario === "no-base" ? opts : { ...opts, baseUrl };
        initMicro(microOpts);
      }

      reinitBtn.addEventListener("click", init);
      toggleOpenBtn.addEventListener("click", () => demosBtn.click());
      modeEl.addEventListener("change", init);
      limitEl.addEventListener("change", init);
      sortEl.addEventListener("change", init);
      scenarioEl.addEventListener("change", init);
      customBaseUrlEl.addEventListener("change", init);

      init();
    </script>
  </body>
</html>
